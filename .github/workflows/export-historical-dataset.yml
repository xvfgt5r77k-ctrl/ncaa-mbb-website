name: Export NCAA MBB Historical Dataset

on:
  workflow_dispatch:
    inputs:
      start_season:
        description: 'First ESPN season ending year (2022 = 2021–22)'
        required: true
        default: '2022'
      end_season:
        description: 'Last completed season ending year (2026 = 2025–26)'
        required: true
        default: '2026'

permissions:
  contents: read

concurrency:
  group: ncaa-mbb-historical-dataset-export
  cancel-in-progress: false

jobs:
  export-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install existing dependencies
        run: python -m pip install -r requirements.txt
      - name: Read-only historical dataset export
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          START_SEASON: ${{ inputs.start_season || '2022' }}
          END_SEASON: ${{ inputs.end_season || '2026' }}
        run: |
          python historical_dataset_export.py --start-season "$START_SEASON" --end-season "$END_SEASON"
      - name: Upload downloadable historical dataset artifact
        uses: actions/upload-artifact@v4
        with:
          name: ncaa-mbb-verified-history
          path: historical_exports/*.zip
          retention-days: 30
          if-no-files-found: error
