name: NCAA MBB V8 Matchup Research
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  retrospective-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check files in repository root
        shell: bash
        run: |
          for f in v3_research.py v4_research.py v5_research.py v6_research.py v8_research.py requirements_v8.txt; do
            if [ ! -f "$f" ]; then echo "Missing $f at repository root"; exit 1; fi
          done
      - name: Install research dependencies
        run: python -m pip install -r requirements_v8.txt
      - name: Run V8 offline tests
        run: python v8_research.py --self-test
      - name: Compare V8 and V5 on completed historical games
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENBLAS_NUM_THREADS: '2'
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
        run: python v8_research.py
      - name: Upload V8 evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ncaa-mbb-v8-research-report
          path: v8_results/
          if-no-files-found: warn
          retention-days: 30
