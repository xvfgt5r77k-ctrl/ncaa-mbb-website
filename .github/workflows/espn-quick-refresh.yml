name: NCAA MBB Quick ESPN Refresh

on:
  workflow_dispatch:
  schedule:
    # Every five minutes: :02, :07, :12, ... :57 UTC.
    # Scheduled runs are best-effort, not guaranteed exact times.
    - cron: '2-59/5 * * * *'

permissions:
  contents: read

# Serialize with the existing nightly importer; never overlap database writes.
concurrency:
  group: ncaa-mbb-update
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Refresh recent and near-future ESPN data
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python cloud_sync.py --days-back 1 --days-forward 2
