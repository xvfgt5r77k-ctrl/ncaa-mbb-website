name: NCAA MBB V7 Completed-Game Research
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  v7-retrospective:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check required files
        shell: bash
        run: |
          for f in v3_research.py v4_research.py v5_research.py v6_research.py v7_research.py requirements_v7.txt; do
            if [ ! -f "$f" ]; then echo "Missing $f at repository root"; exit 1; fi
          done
      - name: Install dependencies
        run: python -m pip install -r requirements_v7.txt
      - name: Check V7 chronological totals
        run: python v7_research.py --self-test
      - name: Run V7 completed-game evaluation
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENBLAS_NUM_THREADS: '2'
          OMP_NUM_THREADS: '2'
        run: python v7_research.py
      - name: Upload completed-game research report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ncaa-mbb-v7-completed-game-report
          path: v7_results/
          if-no-files-found: warn
          retention-days: 30
