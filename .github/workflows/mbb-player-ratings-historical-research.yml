name: NCAA MBB Player Coverage and Rating Research
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  historical-research:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify input files
        run: |
          test -f research_player_ratings.py
          test -f requirements_player_ratings.txt
          test -f tests/test_research_player_ratings.py
      - name: Install dependencies
        run: python -m pip install -r requirements_player_ratings.txt
      - name: Run offline tests
        run: python -m pytest -q tests/test_research_player_ratings.py
      - name: Check database connection
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "Missing DATABASE_URL secret" >&2; exit 1; fi
      - name: Read-only historical analysis
        run: python research_player_ratings.py --output-dir player_rating_research_report
      - name: Upload reports (even if evaluation fails)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ncaa-mbb-player-rating-research-audit
          path: player_rating_research_report/
          if-no-files-found: warn
          retention-days: 30
