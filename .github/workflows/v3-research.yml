name: NCAA MBB V3 Historical Research

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retrospective-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install research dependencies
        run: python -m pip install -r requirements_v3.txt

      - name: Run historical comparison
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python v3_research.py

      - name: Upload HTML and CSV report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ncaa-mbb-v3-historical-report
          path: v3_results/
          if-no-files-found: warn
          retention-days: 30
