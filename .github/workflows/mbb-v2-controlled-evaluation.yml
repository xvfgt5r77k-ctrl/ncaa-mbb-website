name: NCAA MBB V2 Controlled Historical Evaluation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  historical-feature-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify required source files
        run: |
          test -f evaluate_v2_features.py
          test -f db_upgrade_v2.py
          test -f reference/v8_archived_2026.csv
          test -f tests/test_evaluate_v2_features.py
          test -f requirements_feature_eval.txt
      - name: Install research dependencies
        run: python -m pip install -r requirements_feature_eval.txt
      - name: Test the comparison pipeline without database access
        run: python -m unittest discover -s tests -p 'test_evaluate_v2_features.py' -v
      - name: Recheck previous-day feature generator tests if present
        run: |
          if test -f tests/test_db_upgrade.py; then
            python -m unittest discover -s tests -p 'test_db_upgrade.py' -v
          else
            echo 'Prior feature-generator test not in repository; continuing with comparison tests.'
          fi
      - name: Evaluate 2022-2026 historical data (read only)
        run: |
          python evaluate_v2_features.py \
            --v8-reference reference/v8_archived_2026.csv \
            --output-dir v2_controlled_evaluation_results
      - name: Upload the historical evaluation report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ncaa-mbb-v2-controlled-historical-report
          path: v2_controlled_evaluation_results/
          if-no-files-found: error
          retention-days: 30
