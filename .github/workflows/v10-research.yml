name: NCAA MBB V10 Stability and Calibration Research
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  historical-research:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements_v10.txt
      - name: Verify expected model files are at the repository root
        shell: bash
        run: |
          for f in v3_research.py v4_research.py v5_research.py v6_research.py v8_research.py v9_research.py v10_research.py tests_v10_integration.py requirements_v10.txt; do
            if [ ! -f "$f" ]; then echo "Missing required root file: $f"; exit 1; fi
          done
      - name: Install requirements
        run: python -m pip install -r requirements_v10.txt
      - name: Offline timing and probability tests
        run: python v10_research.py --self-test
      - name: Retrospective 2022–2026 evaluation (read-only database)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENBLAS_NUM_THREADS: '2'
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
        run: python v10_research.py
      - name: Upload historical research report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ncaa-mbb-v10-research-report
          path: v10_results/
          if-no-files-found: warn
          retention-days: 30
