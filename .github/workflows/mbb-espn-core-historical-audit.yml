name: NCAA MBB ESPN Core Historical Research Audit
on:
  workflow_dispatch:
    inputs:
      max_games:
        description: 'Completed 2026 games to check, sampled across the season'
        required: true
        default: '500'
        type: choice
        options: ['30', '60', '120', '250', '500']
permissions:
  contents: read
jobs:
  core-predictor-historical-check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact paths and explain missing inputs
        shell: bash
        run: |
          for path in \
            espn_probability_pilot.py \
            espn_core_historical_audit.py \
            requirements_espn_probability.txt \
            reference/2026_model_reference.csv \
            tests/test_espn_core_historical_audit.py; do
            if [[ ! -f "$path" ]]; then
              echo "::error::Missing file at repository path: $path"
              exit 1
            fi
            echo "Found: $path"
          done
      - name: Install existing ESPN research dependencies
        run: python -m pip install -r requirements_espn_probability.txt
      - name: Test offline parser
        run: python -m unittest discover -s tests -p 'test_espn_core_historical_audit.py' -v
      - name: Test 500-game month-stratified sampler offline
        run: python -m unittest discover -s tests -p 'test_espn_core_500_sampling.py' -v
      - name: Query alternative Core endpoint on completed 2026 games
        run: |
          python espn_core_historical_audit.py \
            --reference reference/2026_model_reference.csv \
            --max-games "${{ inputs.max_games || '500' }}" \
            --output-dir espn_core_historical_audit_results
      - name: Upload results even if a later step fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ncaa-mbb-espn-core-historical-audit
          path: espn_core_historical_audit_results/
          if-no-files-found: warn
          retention-days: 30
