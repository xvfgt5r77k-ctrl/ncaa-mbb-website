name: NCAA MBB V6 Historical Research

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v6-historical-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check code files are at repository root
        shell: bash
        run: |
          for f in v3_research.py v4_research.py v5_research.py v6_research.py requirements_v6.txt; do
            if [ ! -f "$f" ]; then
              echo "Missing $f in repository root (not inside a subfolder)"
              exit 1
            fi
          done
      - name: Install dependencies
        run: python -m pip install -r requirements_v6.txt
      - name: Run V6 historical evaluation
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENBLAS_NUM_THREADS: '2'
          OMP_NUM_THREADS: '2'
        run: python v6_research.py
      - name: Upload V6 accuracy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ncaa-mbb-v6-historical-report
          path: v6_results/
          if-no-files-found: warn
          retention-days: 30
