name: NCAA MBB V11 Historical Model Evaluation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  historical-research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements_v11.txt
      - name: Verify model scripts are at repository root
        run: |
          for f in v3_research.py v4_research.py v5_research.py v6_research.py v8_research.py v9_research.py v10_research.py v11_research.py requirements_v11.txt; do
            if [ ! -f "$f" ]; then echo "Missing required root file: $f"; exit 1; fi
          done
      - name: Install Python dependencies
        run: python -m pip install -r requirements_v11.txt
      - name: Check historical timing and model guardrails
        run: python v11_research.py --self-test
      - name: Evaluate V11 versus earlier models on completed historical games
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENBLAS_NUM_THREADS: '2'
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
        run: python v11_research.py
      - name: Upload V11 evaluation report even if the model falls short of the target
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ncaa-mbb-v11-historical-report
          path: v11_results/
          if-no-files-found: warn
          retention-days: 30
