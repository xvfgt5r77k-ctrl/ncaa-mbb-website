name: NCAA MBB V9 Six-Improvements Research
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  retrospective-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check required files in repository root
        shell: bash
        run: |
          for f in v3_research.py v4_research.py v5_research.py v6_research.py v8_research.py v9_research.py requirements_v9.txt; do
            if [ ! -f "$f" ]; then echo "Missing $f in repository root"; exit 1; fi
          done
      - name: Install Python dependencies
        run: python -m pip install -r requirements_v9.txt
      - name: Run V9 safety and chronology tests
        run: python v9_research.py --self-test
      - name: Evaluate V9 vs V5 and V8 on historical games
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENBLAS_NUM_THREADS: '2'
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
        run: python v9_research.py
      - name: Upload accuracy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ncaa-mbb-v9-research-report
          path: v9_results/
          if-no-files-found: warn
          retention-days: 30
