name: NCAA MBB V4 Historical Research

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify V3 and V4 code are present
        run: |
          test -f v3_research.py || (echo 'Missing v3_research.py at repository root' && exit 1)
          test -f v4_research.py || (echo 'Missing v4_research.py at repository root' && exit 1)
      - name: Install research dependencies
        run: python -m pip install -r requirements_v4.txt
      - name: Run historical V4 comparison
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python v4_research.py
      - name: Upload V4 HTML and CSV report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ncaa-mbb-v4-historical-report
          path: v4_results/
          if-no-files-found: warn
          retention-days: 30
