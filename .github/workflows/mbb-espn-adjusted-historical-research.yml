name: NCAA MBB ESPN Adjusted Historical Research
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-historical-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify required files
        run: |
          for f in espn_adjusted_research.py requirements_espn_adjusted_research.txt reference/espn_core_2026_500.csv tests/test_espn_adjusted_research.py; do
            if [ ! -f "$f" ]; then echo "MISSING: $f"; exit 1; fi
          done
      - name: Install research dependencies
        run: python -m pip install -r requirements_espn_adjusted_research.txt
      - name: Run offline tests
        run: python -m unittest discover -s tests -p 'test_espn_adjusted_research.py' -v
      - name: Analyze archived historical games only
        run: |
          python espn_adjusted_research.py \
            --input reference/espn_core_2026_500.csv \
            --output-dir espn_adjusted_research_results
      - name: Upload evaluation artifact
        uses: actions/upload-artifact@v4
        with:
          name: ncaa-mbb-espn-adjusted-historical-research
          path: espn_adjusted_research_results/
          if-no-files-found: error
          retention-days: 30
