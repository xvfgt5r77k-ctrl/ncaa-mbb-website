name: NCAA MBB V5 Four-Factor Historical Research

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v5-historical-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify all research scripts are at repository root
        run: |
          test -f v3_research.py || (echo 'Missing v3_research.py in root' && exit 1)
          test -f v4_research.py || (echo 'Missing v4_research.py in root' && exit 1)
          test -f v5_research.py || (echo 'Missing v5_research.py in root' && exit 1)
          test -f requirements_v5.txt || (echo 'Missing requirements_v5.txt in root' && exit 1)
      - name: Install dependencies
        run: python -m pip install -r requirements_v5.txt
      - name: Run V5 research comparison
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python v5_research.py
      - name: Upload V5 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ncaa-mbb-v5-four-factor-report
          path: v5_results/
          if-no-files-found: warn
          retention-days: 30
