name: Update NCAA MBB Adjusted SOS and History

on:
  workflow_run:
    workflows:
      - "NCAA MBB Nightly ESPN Update"
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ncaa-mbb-historical-analytics
  cancel-in-progress: false

jobs:
  build-analytics:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out dashboard source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install existing project dependencies
        run: python -m pip install -r requirements.txt
      - name: Build adjusted ratings and leak-free historical dataset
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python historical_analytics.py
